<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <style>
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17202a}
      .subtitle{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#455a64}
      .box{fill:#fff;stroke:#263238;stroke-width:2;rx:8}
      .module{fill:#f8fbff;stroke:#1f4e79;stroke-width:2;rx:8}
      .pin{font:15px Consolas,"Microsoft YaHei",monospace;fill:#17202a}
      .label{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#17202a}
      .note{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#546e7a}
      .small{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#546e7a}
      .power3{stroke:#d32f2f;stroke-width:4;fill:none}
      .power5{stroke:#ef6c00;stroke-width:4;fill:none}
      .gnd{stroke:#263238;stroke-width:4;fill:none}
      .i2c{stroke:#00897b;stroke-width:3;fill:none}
      .data{stroke:#7b1fa2;stroke-width:3;fill:none}
      .pir{stroke:#1976d2;stroke-width:3;fill:none}
      .uart{stroke:#0097a7;stroke-width:3;fill:none}
      .ctrl{stroke:#6d4c41;stroke-width:3;fill:none}
      .busA{stroke:#c2185b;stroke-width:4;fill:none}
      .busB{stroke:#5e35b1;stroke-width:4;fill:none}
      .node{fill:#17202a}
      .res{fill:#fff3e0;stroke:#ef6c00;stroke-width:2}
    </style>
  </defs>

  <text x="40" y="48" class="title">ESP32-C6 单个采集节点完整接线示意</text>
  <text x="40" y="78" class="subtitle">按开发板丝印 GPIO/IO 名称接线；不同 ESP32-C6 开发板排针位置可能不同，不按图中左右位置找针。</text>

  <rect x="50" y="135" width="300" height="620" class="box"/>
  <text x="80" y="175" class="title" style="font-size:22px">ESP32-C6-WROOM-1 开发板</text>
  <text x="80" y="205" class="note">推荐用 3.3V 逻辑；所有模块共地</text>

  <g>
    <circle cx="330" cy="250" r="4" class="node"/><text x="85" y="255" class="pin">3V3</text>
    <circle cx="330" cy="300" r="4" class="node"/><text x="85" y="305" class="pin">5V / VBUS</text>
    <circle cx="330" cy="350" r="4" class="node"/><text x="85" y="355" class="pin">GND</text>
    <circle cx="330" cy="410" r="4" class="node"/><text x="85" y="415" class="pin">GPIO6 / IO6  (I2C SDA)</text>
    <circle cx="330" cy="450" r="4" class="node"/><text x="85" y="455" class="pin">GPIO7 / IO7  (I2C SCL)</text>
    <circle cx="330" cy="510" r="4" class="node"/><text x="85" y="515" class="pin">GPIO11 / IO11 (AM2302 DATA)</text>
    <circle cx="330" cy="570" r="4" class="node"/><text x="85" y="575" class="pin">GPIO10 / IO10 (PIR OUT)</text>
    <circle cx="330" cy="635" r="4" class="node"/><text x="85" y="640" class="pin">GPIO20 / IO20 (UART TX)</text>
    <circle cx="330" cy="675" r="4" class="node"/><text x="85" y="680" class="pin">GPIO21 / IO21 (UART RX)</text>
    <circle cx="330" cy="715" r="4" class="node"/><text x="85" y="720" class="pin">GPIO18 / IO18 (DE 与 /RE)</text>
  </g>

  <rect x="520" y="125" width="300" height="180" class="module"/>
  <text x="545" y="160" class="title" style="font-size:20px">GY-302 / BH1750 光照模块</text>
  <text x="545" y="190" class="pin">VCC  GND  SDA  SCL  ADDR</text>
  <text x="545" y="220" class="note">VCC 接 3V3；SDA/SCL 为 I2C</text>
  <text x="545" y="248" class="note">ADDR 默认低电平地址常用 0x23</text>

  <rect x="520" y="350" width="300" height="170" class="module"/>
  <text x="545" y="385" class="title" style="font-size:20px">DHT22 / AM2302 温湿度</text>
  <text x="545" y="415" class="pin">VCC  DATA  NC  GND</text>
  <text x="545" y="445" class="note">DATA 到 3V3 加 4.7k-10k 上拉</text>
  <text x="545" y="473" class="note">读数间隔不小于 2 秒</text>

  <rect x="520" y="570" width="300" height="145" class="module"/>
  <text x="545" y="605" class="title" style="font-size:20px">HC-SR501 PIR 模块</text>
  <text x="545" y="635" class="pin">VCC  OUT  GND</text>
  <text x="545" y="665" class="note">模块常用 5V 供电；OUT 进 ESP32 前先测电平</text>

  <rect x="930" y="395" width="290" height="300" class="module"/>
  <text x="955" y="430" class="title" style="font-size:20px">3.3V RS485 模块</text>
  <text x="955" y="462" class="pin">VCC  GND  DI  RO  DE  /RE</text>
  <text x="955" y="492" class="pin">A    B</text>
  <text x="955" y="524" class="note">SP3485/MAX3485/ADM3485 这类 3.3V 半双工收发器</text>
  <text x="955" y="552" class="note">DE 与 /RE 可并到 GPIO18</text>
  <text x="955" y="580" class="note">发送: GPIO18=1；接收: GPIO18=0</text>

  <rect x="560" y="525" width="120" height="36" class="res"/>
  <text x="574" y="548" class="label">4.7k-10k</text>
  <text x="690" y="548" class="note">DATA 上拉到 3V3</text>

  <path d="M330 250 H430 V145 H520" class="power3"/>
  <path d="M330 250 H430 V360 H520" class="power3"/>
  <path d="M330 250 H890 V405 H930" class="power3"/>
  <path d="M330 300 H455 V580 H520" class="power5"/>
  <path d="M330 350 H470 V205 H520" class="gnd"/>
  <path d="M330 350 H470 V500 H520" class="gnd"/>
  <path d="M330 350 H470 V700 H520" class="gnd"/>
  <path d="M330 350 H890 V435 H930" class="gnd"/>

  <path d="M330 410 H500 V178 H520" class="i2c"/>
  <path d="M330 450 H500 V198 H520" class="i2c"/>

  <path d="M330 510 H520" class="data"/>
  <path d="M445 250 V543 H560" class="power3"/>
  <path d="M680 543 H725 V510 H520" class="data"/>

  <path d="M820 645 H880 V570 H330" class="pir"/>
  <path d="M330 635 H930" class="uart"/>
  <path d="M930 675 H330" class="uart"/>
  <path d="M330 715 H930" class="ctrl"/>

  <path d="M1220 620 H1060" class="busA"/>
  <path d="M1220 655 H1060" class="busB"/>
  <text x="1070" y="615" class="pin">A -> RS485 总线 A</text>
  <text x="1070" y="690" class="pin">B -> RS485 总线 B</text>

  <g>
    <line x1="60" y1="812" x2="110" y2="812" class="power3"/><text x="120" y="817" class="small">3.3V</text>
    <line x1="190" y1="812" x2="240" y2="812" class="power5"/><text x="250" y="817" class="small">5V/VBUS</text>
    <line x1="350" y1="812" x2="400" y2="812" class="gnd"/><text x="410" y="817" class="small">GND</text>
    <line x1="500" y1="812" x2="550" y2="812" class="i2c"/><text x="560" y="817" class="small">I2C</text>
    <line x1="645" y1="812" x2="695" y2="812" class="data"/><text x="705" y="817" class="small">AM2302 DATA</text>
    <line x1="835" y1="812" x2="885" y2="812" class="pir"/><text x="895" y="817" class="small">PIR OUT</text>
    <line x1="1010" y1="812" x2="1060" y2="812" class="uart"/><text x="1070" y="817" class="small">UART</text>
  </g>
</svg>
