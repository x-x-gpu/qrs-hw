<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-C6 单采集节点接线示意图</title>
  <desc id="desc">ESP32-C6-WROOM-1 连接 GY-302 BH1750、DHT22 AM2302、HC-SR501 和 3.3V RS485 收发器。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .box { fill: #ffffff; stroke: #24313a; stroke-width: 2; rx: 8; }
      .small { fill: #ffffff; stroke: #50616d; stroke-width: 2; rx: 8; }
      .pin { font: 15px Consolas, monospace; fill: #172026; }
      .title { font: 700 22px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172026; }
      .label { font: 16px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172026; }
      .note { font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #52616b; }
      .wire33 { stroke: #d97706; stroke-width: 4; fill: none; }
      .wire5 { stroke: #dc2626; stroke-width: 4; fill: none; }
      .gnd { stroke: #374151; stroke-width: 4; fill: none; }
      .sig { stroke: #0f766e; stroke-width: 4; fill: none; }
      .i2c { stroke: #2563eb; stroke-width: 4; fill: none; }
      .uart { stroke: #7c3aed; stroke-width: 4; fill: none; }
      .bus { stroke: #0f172a; stroke-width: 5; fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="760"/>
  <text class="title" x="36" y="46">ESP32-C6 单采集节点接线示意图</text>
  <text class="note" x="36" y="72">所有 3.3V 数字信号必须共地；HC-SR501 用 5V 供电但 OUT 需先实测约 3.3V。</text>

  <rect class="box" x="430" y="130" width="300" height="430"/>
  <text class="title" x="500" y="165">ESP32-C6-WROOM-1</text>
  <text class="pin" x="452" y="215">3V3</text>
  <text class="pin" x="452" y="250">5V/VBUS</text>
  <text class="pin" x="452" y="285">GND</text>
  <text class="pin" x="452" y="330">GPIO6  SDA</text>
  <text class="pin" x="452" y="365">GPIO7  SCL</text>
  <text class="pin" x="452" y="410">GPIO11 AM2302_DATA</text>
  <text class="pin" x="452" y="455">GPIO10 PIR_IN</text>
  <text class="pin" x="452" y="500">GPIO20 UART_TX</text>
  <text class="pin" x="452" y="535">GPIO21 UART_RX</text>
  <text class="pin" x="452" y="570">GPIO18 RS485_DE</text>

  <rect class="small" x="58" y="120" width="245" height="150"/>
  <text class="title" x="96" y="154">GY-302 / BH1750</text>
  <text class="pin" x="82" y="190">VCC -> 3V3</text>
  <text class="pin" x="82" y="220">GND -> GND</text>
  <text class="pin" x="82" y="250">SDA -> GPIO6</text>
  <text class="pin" x="82" y="280">SCL -> GPIO7</text>

  <rect class="small" x="58" y="330" width="245" height="125"/>
  <text class="title" x="89" y="364">DHT22 / AM2302</text>
  <text class="pin" x="82" y="400">VCC -> 3V3</text>
  <text class="pin" x="82" y="430">DATA -> GPIO11</text>
  <text class="note" x="82" y="452">DATA 用 4.7k-10k 上拉到 3V3</text>

  <rect class="small" x="58" y="510" width="245" height="125"/>
  <text class="title" x="94" y="544">HC-SR501 RD-624</text>
  <text class="pin" x="82" y="580">VCC -> 5V</text>
  <text class="pin" x="82" y="610">OUT -> GPIO10</text>
  <text class="pin" x="82" y="640">GND -> GND</text>

  <rect class="small" x="860" y="235" width="250" height="230"/>
  <text class="title" x="894" y="268">3.3V RS485 收发器</text>
  <text class="note" x="903" y="290">MAX3485 / SP3485</text>
  <text class="pin" x="886" y="330">VCC -> 3V3</text>
  <text class="pin" x="886" y="360">GND -> GND</text>
  <text class="pin" x="886" y="390">DI  <- GPIO20 TX</text>
  <text class="pin" x="886" y="420">RO  -> GPIO21 RX</text>
  <text class="pin" x="886" y="450">DE,/RE <- GPIO18</text>

  <path class="wire33" d="M430 210 C365 210 360 185 303 185"/>
  <path class="gnd" d="M430 285 C365 285 360 220 303 220"/>
  <path class="i2c" d="M430 330 C362 330 345 250 303 250"/>
  <path class="i2c" d="M430 365 C350 365 342 280 303 280"/>

  <path class="wire33" d="M430 210 C360 210 355 398 303 398"/>
  <path class="sig" d="M430 410 C360 410 354 430 303 430"/>
  <path class="gnd" d="M430 285 C360 285 356 455 303 455"/>

  <path class="wire5" d="M430 250 C350 250 350 580 303 580"/>
  <path class="sig" d="M430 455 C350 455 350 610 303 610"/>
  <path class="gnd" d="M430 285 C350 285 350 640 303 640"/>

  <path class="wire33" d="M730 210 C800 210 804 330 860 330"/>
  <path class="gnd" d="M730 285 C800 285 804 360 860 360"/>
  <path class="uart" d="M730 500 C802 500 802 390 860 390"/>
  <path class="uart" d="M730 535 C802 535 802 420 860 420"/>
  <path class="sig" d="M730 570 C803 570 806 450 860 450"/>

  <path class="bus" d="M1110 382 H1160"/>
  <path class="bus" d="M1110 430 H1160"/>
  <text class="pin" x="1120" y="372">A</text>
  <text class="pin" x="1120" y="454">B</text>
  <text class="note" x="830" y="505">A/B 接入 RS485 主干线；端点节点启用 120Ω 终端。</text>

  <text class="note" x="36" y="704">建议上电顺序：先只接 3V3/GND 与传感器，确认读数；再接 RS485；最后接战舰 V3 主站。</text>
</svg>
